org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4g

# Kotlin/Native link of a Compose framework does whole-program optimisation and
# needs far more heap than the 3g default — release linking OOMs without this.
kotlin.native.jvmArgs=-Xmx8g

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Compose Multiplatform
org.jetbrains.compose.experimental.uikit.enabled=false
